<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Planeta -->
  <circle cx="100" cy="100" r="90" fill="#4CAF50" stroke="#2E7D32" stroke-width="3"/>
  
  <!-- Continentes -->
  <path d="M 40 80 Q 50 70 60 75 Q 65 80 55 90 Q 45 95 40 90 Z" fill="#2E7D32"/>
  <path d="M 120 60 Q 140 50 150 70 Q 145 85 130 85 Q 120 75 120 60 Z" fill="#2E7D32"/>
  <path d="M 70 130 Q 90 120 110 135 Q 100 145 80 140 Z" fill="#2E7D32"/>
  
  <!-- Oceanos (mosaico) -->
  <circle cx="50" cy="50" r="4" fill="#1976D2" opacity="0.6"/>
  <circle cx="140" cy="90" r="3" fill="#1976D2" opacity="0.6"/>
  <circle cx="80" cy="110" r="3.5" fill="#1976D2" opacity="0.6"/>
  
  <!-- Efeito de luz -->
  <ellipse cx="70" cy="70" rx="30" ry="25" fill="white" opacity="0.15"/>
  
  <!-- Aura de energia -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#4CAF50" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>
</svg>